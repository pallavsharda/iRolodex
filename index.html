<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iRolodex</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #38bdf8;
      --tag-bg: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .header-title { font-size: 1.1rem; font-weight: 700; }
    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .status-badge.online { color: #4ade80; border-color: #22c55e44; }
    .nav-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.95rem;
      cursor: pointer;
    }
    .search-bar {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .filters { display: flex; gap: 8px; }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }
    main { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
    .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: var(--tag-bg);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .view { display: none; }
    .view.active { display: block; }
    /* Detail View Styling */
    .detail-header { margin-bottom: 16px; }
    .detail-name { font-size: 1.4rem; font-weight: 700; }
    .detail-sub { font-size: 0.95rem; color: var(--text-muted); margin-top: 2px; }
    .meta-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }
    .meta-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #27272a55; }
    .meta-row:last-child { border-bottom: none; }
    .meta-label { color: var(--text-muted); }
    .markdown-body { font-size: 0.95rem; line-height: 1.6; color: #d4d4d8; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--text); margin: 16px 0 8px 0; }
    .markdown-body ul { padding-left: 20px; margin-bottom: 12px; }
    .markdown-body p { margin-bottom: 12px; }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .danger-btn { background: #ef4444; color: #fff; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Home / List View -->
  <div id="view-list" class="view active">
    <header>
      <span class="header-title">iRolodex</span>
      <div>
        <span id="conn-status" class="status-badge">Offline</span>
        <button class="nav-btn" onclick="showSettings()" style="margin-left: 8px;">Config</button>
      </div>
    </header>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search people, tags, orgs..." oninput="handleSearch()">
      <div class="filters">
        <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="filter-person" onclick="setFilter('person')">People</button>
        <button class="filter-btn" id="filter-org" onclick="setFilter('org')">Orgs</button>
      </div>
    </div>
    <main id="contacts-container"></main>
  </div>

  <!-- Detail View -->
  <div id="view-detail" class="view">
    <header>
      <button class="nav-btn" onclick="showList()">← Back</button>
      <span class="header-title" id="detail-header-title">Record</span>
      <div style="width: 40px;"></div>
    </header>
    <main>
      <div class="detail-header">
        <div class="detail-name" id="det-name"></div>
        <div class="detail-sub" id="det-sub"></div>
      </div>
      <div class="meta-box" id="det-meta"></div>
      <div class="markdown-body" id="det-content"></div>
    </main>
  </div>

  <!-- Settings View -->
  <div id="view-settings" class="view">
    <header>
      <button class="nav-btn" onclick="showList()">← Done</button>
      <span class="header-title">GitHub Config</span>
      <div style="width: 40px;"></div>
    </header>
    <main style="display: flex; flex-direction: column; gap: 14px; padding-top: 20px;">
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Personal Access Token (fine-grained repo scope)</label>
        <input type="password" id="cfg-pat" placeholder="github_pat_...">
      </div>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Owner / Name</label>
        <input type="text" id="cfg-repo" placeholder="username/notes-crm">
      </div>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Notes Subfolder (optional)</label>
        <input type="text" id="cfg-path" placeholder="e.g. contacts or leave empty">
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 10px;" id="cfg-status">
        Local Cache: Ready
      </div>
      <button class="btn" onclick="syncGithub()">Sync Now from GitHub</button>
      <button class="btn danger-btn" onclick="clearData()">Clear Local Database</button>
    </main>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Network status listener
    function updateOnlineStatus() {
      const el = document.getElementById('conn-status');
      if (navigator.onLine) {
        el.textContent = 'Online';
        el.className = 'status-badge online';
      } else {
        el.textContent = 'Offline';
        el.className = 'status-badge';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // IndexedDB setup
    const DB_NAME = 'PersonalCRM';
    const STORE_NAME = 'records';
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
            dbInstance.createObjectStore(STORE_NAME, { keyPath: 'path' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    function getAllRecords() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    function putRecord(item) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    // Parsing helper for Markdown frontmatter
    function parseFrontmatter(raw) {
      const match = raw.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);
      if (!match) return { meta: {}, content: raw };

      const yamlStr = match[1];
      const content = match[2];
      const meta = {};

      yamlStr.split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > -1) {
          const key = line.slice(0, idx).trim();
          let val = line.slice(idx + 1).trim();
          if (val.startsWith('[') && val.endsWith(']')) {
            val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
          } else {
            val = val.replace(/^['"]|['"]$/g, '');
          }
          meta[key] = val;
        }
      });
      return { meta, content };
    }

    // Navigation state
    let allRecords = [];
    let currentFilter = 'all';

    function showList() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-list').classList.add('active');
    }

    function showSettings() {
      document.getElementById('cfg-pat').value = localStorage.getItem('crm_pat') || '';
      document.getElementById('cfg-repo').value = localStorage.getItem('crm_repo') || '';
      document.getElementById('cfg-path').value = localStorage.getItem('crm_path') || '';
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-settings').classList.add('active');
    }

    function showDetail(path) {
      const item = allRecords.find(r => r.path === path);
      if (!item) return;

      document.getElementById('det-name').textContent = item.meta.name || item.path.split('/').pop().replace(/\.md$/, '');
      document.getElementById('det-sub').textContent = [item.meta.role, item.meta.organization].filter(Boolean).join(' @ ');

      const metaHtml = Object.entries(item.meta)
        .filter(([k]) => !['name', 'role', 'organization', 'type'].includes(k))
        .map(([k, v]) => `
          <div class="meta-row">
            <span class="meta-label">${k}</span>
            <span>${Array.isArray(v) ? v.join(', ') : v}</span>
          </div>
        `).join('');
      document.getElementById('det-meta').innerHTML = metaHtml || '<div style="color:var(--text-muted)">No additional metadata</div>';

      document.getElementById('det-content').innerHTML = marked.parse(item.content);

      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-detail').classList.add('active');
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('filter-' + type).classList.add('active');
      renderList();
    }

    function handleSearch() {
      renderList();
    }

    function renderList() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('contacts-container');

      const filtered = allRecords.filter(r => {
        const type = (r.meta.type || 'person').toLowerCase();
        if (currentFilter !== 'all' && type !== currentFilter) return false;

        if (!q) return true;
        const name = (r.meta.name || r.path).toLowerCase();
        const org = (r.meta.organization || '').toLowerCase();
        const role = (r.meta.role || '').toLowerCase();
        const tags = Array.isArray(r.meta.tags) ? r.meta.tags.join(' ').toLowerCase() : (r.meta.tags || '').toLowerCase();
        const body = (r.content || '').toLowerCase();
        return name.includes(q) || org.includes(q) || role.includes(q) || tags.includes(q) || body.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px 0;">No matching records found</div>';
        return;
      }

      container.innerHTML = filtered.map(r => {
        const title = r.meta.name || r.path.split('/').pop().replace(/\.md$/, '');
        const sub = [r.meta.role, r.meta.organization].filter(Boolean).join(' @ ');
        const tags = Array.isArray(r.meta.tags) ? r.meta.tags : (r.meta.tags ? [r.meta.tags] : []);
        return `
          <div class="card" onclick="showDetail('${r.path}')">
            <div class="card-title">${title}</div>
            ${sub ? `<div class="card-subtitle">${sub}</div>` : ''}
            <div class="tag-container">
              ${tags.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    async function syncGithub() {
      const pat = document.getElementById('cfg-pat').value.trim();
      const repo = document.getElementById('cfg-repo').value.trim();
      const prefix = document.getElementById('cfg-path').value.trim().replace(/^\/|\/$/g, '');
      const statusEl = document.getElementById('cfg-status');

      if (!pat || !repo) {
        alert('Please fill out the PAT and Repository name.');
        return;
      }

      localStorage.setItem('crm_pat', pat);
      localStorage.setItem('crm_repo', repo);
      localStorage.setItem('crm_path', prefix);

      statusEl.textContent = 'Fetching repository tree...';

      try {
        const headers = {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github.v3+json'
        };

        // 1. Get default branch commit
        const repoRes = await fetch(`https://api.github.com/repos/${repo}`, { headers });
        if (!repoRes.ok) throw new Error('Repository lookup failed: ' + repoRes.statusText);
        const repoData = await repoRes.json();
        const branch = repoData.default_branch;

        // 2. Fetch entire git tree recursively
        const treeRes = await fetch(`https://api.github.com/repos/${repo}/git/trees/${branch}?recursive=1`, { headers });
        if (!treeRes.ok) throw new Error('Tree lookup failed');
        const treeData = await treeRes.json();

        // 3. Filter markdown files inside specified folder
        const mdFiles = treeData.tree.filter(node => {
          if (node.type !== 'blob' || !node.path.endsWith('.md')) return false;
          if (prefix && !node.path.startsWith(prefix)) return false;
          return true;
        });

        statusEl.textContent = `Syncing ${mdFiles.length} files...`;

        // 4. Fetch content for each file
        for (let i = 0; i < mdFiles.length; i++) {
          const file = mdFiles[i];
          const blobRes = await fetch(file.url, { headers });
          const blobData = await blobRes.json();
          const rawContent = decodeURIComponent(escape(atob(blobData.content)));
          const { meta, content } = parseFrontmatter(rawContent);

          await putRecord({
            path: file.path,
            sha: file.sha,
            meta,
            content
          });
          statusEl.textContent = `Downloaded ${i + 1}/${mdFiles.length}...`;
        }

        statusEl.textContent = `Sync finished! ${mdFiles.length} files stored offline.`;
        await reloadData();
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    async function clearData() {
      if (confirm('Clear local offline records?')) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = async () => {
          await reloadData();
          document.getElementById('cfg-status').textContent = 'Local records cleared.';
        };
      }
    }

    async function reloadData() {
      allRecords = await getAllRecords();
      renderList();
    }

    // Bootstrap
    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      await reloadData();
      if (allRecords.length === 0 && !localStorage.getItem('crm_pat')) {
        showSettings();
      }
    });
  </script>
</body>
</html>
